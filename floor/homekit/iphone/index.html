<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ガッチ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c1b1a">
<title>ガッチ パネル</title>
<style>
  :root{
    --bg:#1c1b1a; --ink:#f3efe8; --sub:#9a948a;
    --b1:#3a3733; --b1p:#55504a;
    --gap:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden}
  main{height:100dvh;display:flex;flex-direction:column;
    padding:max(env(safe-area-inset-top),20px) 16px max(env(safe-area-inset-bottom),20px)}
  h1{margin:0 0 14px;font-size:13px;font-weight:500;letter-spacing:.2em;color:var(--sub)}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;
    grid-template-rows:repeat(3,1fr);gap:var(--gap)}
  .grid a{display:flex;align-items:center;justify-content:center;text-align:center;
    background:var(--b1);color:var(--ink);text-decoration:none;
    border-radius:20px;font-size:clamp(20px,6vw,26px);font-weight:600;letter-spacing:.04em;
    border-left:6px solid var(--c);
    transition:transform .08s,background .08s;user-select:none;-webkit-user-select:none}
  .grid a:active,.grid a.on{background:var(--b1p);transform:scale(.97)}
  .grid a.wide{grid-column:1 / -1}
  .err{height:18px;margin-top:10px;font-size:12px;color:#e8a08a;text-align:center;visibility:hidden}
  .err.show{visibility:visible}
</style>
</head>
<body>
<main>
  <h1>ガっチガチ研究所</h1>
  <nav class="grid" id="grid"></nav>
  <div class="err" id="err">つながらん。ショートカットの名前を確認してな</div>
</main>
<script>
/* ===== 設定：ここだけ直せば動く =====
   name   … 画面のボタン名（scenes.md の呼び名と同じ）
   shortcut … iPhoneの「ショートカット」アプリに作った名前（動作は「ホーム → シーンを実行」）
   color  … 左の細い色線
   将来、HA版に差し替える時は、この配列の href だけ入れ替える。 */
const SCENES = [
  { name:"仕事だよ",   shortcut:"仕事だよ",   color:"#d9a441" },
  { name:"おはよう",   shortcut:"おはよう",   color:"#8fb9a8" },
  { name:"おやすみ",   shortcut:"おやすみ",   color:"#7a8cc2" },
  { name:"明るくして", shortcut:"明るくして", color:"#e8d28a" },
  { name:"作業モード", shortcut:"作業モード", color:"#c98a6b", wide:true },
];
const grid = document.getElementById("grid");
for (const s of SCENES) {
  const a = document.createElement("a");
  a.textContent = s.name;
  a.style.setProperty("--c", s.color);
  if (s.wide) a.className = "wide";
  a.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(s.shortcut);
  a.addEventListener("click", () => {
    a.classList.add("on");
    setTimeout(() => a.classList.remove("on"), 250);
  });
  grid.appendChild(a);
}
</script>
</body>
</html>
