/* 状態ボード（4列）：枠はキキの画像。見出し（待機中〜完了）は画像に入っている。中の4マスにマグネットを重ねる */

.frame.img.pdrag{cursor:grabbing;z-index:9500!important;filter:drop-shadow(0 12px 14px rgba(0,0,0,.55))}

.rz{position:absolute;right:7px;bottom:7px;width:26px;height:26px;border-radius:7px;background:rgba(255,246,220,.9);border:2px solid #b8861f;color:#7a4a00;font-size:16px;line-height:22px;text-align:center;cursor:nwse-resize;opacity:.0;transition:opacity .15s;z-index:20;touch-action:none}

@media (hover:none){.rz{opacity:.75}}
.partner{touch-action:none;-webkit-user-select:none;user-select:none}
.partner img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
#board .cols{position:absolute;inset:0}
.col{position:absolute;top:33.3%;height:52.6%;overflow:visible;container-type:size}
.col:nth-child(1){left:5%;width:21%}.col:nth-child(2){left:28.5%;width:20.7%}
.col:nth-child(3){left:50.8%;width:21.4%}.col:nth-child(4){left:74.2%;width:21.1%}
.mag{/* 1列に最大6個。高さは、列の高さ÷個数に合わせて縮む（絵の比 2.36:1 のまま）。個数が少ない時は、いつもの大きさ */
  --h:min(calc(94cqw / 2.36), calc(100cqh / var(--cnt,4) * 1.9));
  --step:min(calc(var(--k,0) * (100cqh - var(--h))), calc(var(--h) * .72));
  position:absolute;left:50%;transform:translateX(-50%);width:calc(var(--h) * 2.36);height:var(--h);top:calc(var(--i,0) * var(--step));
  border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));container-type:inline-size}
.mag img{display:block;width:100%;height:100%}
/* 文字は、マグネットの真ん中（縦も横も）。大きさは、マグネットの幅と、文字数に合わせる（長い名前は小さく） */
.mag span{position:absolute;left:0;right:0;top:0;height:var(--step);padding:0 7%;display:flex;align-items:center;justify-content:center;font-size:clamp(6px,min(15cqw,calc(82cqw/var(--n,4)),calc(var(--step) * .62)),17px);line-height:1;font-weight:800;white-space:nowrap;font-family:inherit}
.mag.last span{height:var(--h);padding-bottom:5%}
.mag i{font-style:normal;margin-left:3px;font-size:.85em}
.more{position:absolute;right:2px;bottom:-15px;font-size:13px;font-weight:800;background:#fff;border:2px solid #5a3a12;border-radius:10px;padding:0 6px;z-index:50}

/* 日時プレート：枠はキキの画像（数字は消してある）。日付と時刻はコードで載せる */
#plate{left:659px;top:12px;width:480px;height:68px;background:url(ui/plate.webp) center/100% 100% no-repeat;display:block;color:#1a1208;font-weight:800;font-variant-numeric:tabular-nums}
#plate #pd{position:absolute;left:17.5%;width:35%;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:19px;letter-spacing:.02em;white-space:nowrap}

/* 拡声器ボード（読むだけ）：枠はキキの画像 */
.tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:linear-gradient(180deg,#fff6dc,#ecd197);border:2px solid #b8861f;border-radius:8px;padding:0 8px;font-size:13px;font-weight:800;color:#3a2412;white-space:nowrap;box-shadow:0 2px 3px rgba(0,0,0,.4);pointer-events:none}

/* 完成品置き場：枠はキキの縦長の枠を、角と辺を固定して横に伸ばして作った画像 */
#products{left:1338px;top:8px;width:254px;height:1004px;background:url(ui/products-v.webp) center/100% 100% no-repeat}
#products .in{position:absolute;left:11%;right:11%;top:44px;bottom:62px;overflow:auto;overscroll-behavior:contain}
#products h2{font-size:19px;letter-spacing:.1em;margin:0 0 12px;text-align:center}

/* 壁のアイコン（キキ・えみ） */
.partner{position:absolute;width:155px;height:155px;border:0;background:none;padding:0;cursor:pointer;z-index:5}
.partner img{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.partner:hover img{filter:drop-shadow(0 4px 6px rgba(0,0,0,.5)) brightness(1.08)}

/* ----- キャラ ----- */
#chars{position:absolute;inset:0;pointer-events:none}
.ch{position:absolute;width:140px;height:140px;border:0;background:none;padding:0;cursor:pointer;pointer-events:auto;transition:width .7s ease,height .7s ease,left .7s ease,top .7s ease}
.ch.dragging,.ch.sizing{transition:none}
.ch .art{width:100%;height:100%;display:block;transform-origin:50% 92%;filter:drop-shadow(0 6px 5px rgba(0,0,0,.45))}
.ch.flip .art{scale:-1 1}
.ch.visitor{display:none;pointer-events:auto}
.ch.visitor.on{display:block}
.ch.visitor .art{animation:none!important}
.vshadow{position:absolute;left:50%;bottom:6px;width:70px;height:14px;margin-left:-35px;border-radius:50%;background:rgba(0,0,0,.38);filter:blur(3px);pointer-events:none}
.ch img{-webkit-user-drag:none;user-drag:none}
.ch{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.ch.dragging{cursor:grabbing;transition:none}
.crz{position:absolute;right:-6px;bottom:6px;width:22px;height:22px;border-radius:6px;background:rgba(255,246,220,.92);border:2px solid #b8861f;color:#7a4a00;font-size:13px;line-height:18px;text-align:center;cursor:nwse-resize;opacity:0;transition:opacity .15s;z-index:30;touch-action:none}
.ch:hover .crz{opacity:.95}
@media (hover:none){.crz{opacity:.7}}
/* ③ いま仕事してる子は、「今やってる」が、ずっと見える（頭の上に、やってること） */
.doing{position:absolute;left:50%;top:-20px;transform:translateX(-50%);max-width:190px;background:linear-gradient(180deg,#fff6dc,#f3dca0);border:2px solid #b8861f;border-radius:10px;padding:0 8px;font-size:12px;font-weight:800;color:#3a2412;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 4px rgba(0,0,0,.4);pointer-events:none;z-index:3}
.doing:after{content:"▌";margin-left:2px;animation:caret .9s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.ch:has(.say) .doing,.ch:has(.bubble) .doing{display:none}
@media (prefers-reduced-motion:reduce){.doing:after{animation:none}}
.ch.dragging .art{animation:none!important;transform:scale(1.08) translateY(-6px);filter:drop-shadow(0 14px 8px rgba(0,0,0,.5))}
@keyframes poke{0%{transform:scale(1,1)}25%{transform:scale(1.12,.86) translateY(4px)}55%{transform:scale(.94,1.12) translateY(-22px)}80%{transform:scale(1.04,.96) translateY(0)}100%{transform:scale(1,1)}}
.ch.react .art{animation:poke .6s ease-out 1!important}
.ch.faking .art{animation:typing calc(.34s*var(--k,1)) linear infinite!important}
.say.soft{background:#fffdf3;font-size:15px;font-weight:700;border-width:2px;border-radius:12px;padding:1px 9px}
.say.soft:after{border-top-color:#3a2412}
#dlg .dnow{margin:8px 0;padding:8px 10px;border:2px solid #6b4a1a;border-radius:8px;background:rgba(255,236,170,.75);font-size:15px;font-weight:700;line-height:1.5}
#dlg .dnow small{display:block;font-size:11px;font-weight:800;opacity:.7}
#dlg .dmm{font-size:12px;opacity:.75}
.say{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:#fff;border:3px solid #3a2412;border-radius:14px;padding:1px 10px;font-size:16px;font-weight:800;color:#3a2412;white-space:nowrap;z-index:2;pointer-events:none;box-shadow:0 3px 5px rgba(0,0,0,.4)}
.say:after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:6px solid transparent;border-top-color:#3a2412;border-bottom:0}
#rbox{position:absolute;left:1152px;top:14px;width:176px;z-index:9100;display:flex;flex-direction:column;align-items:center;gap:3px}
#refresh{font:inherit;font-size:20px;font-weight:800;border:3px solid #b8861f;border-radius:22px;background:linear-gradient(180deg,#fff6dc,#ecd197);color:#3a2412;padding:5px 18px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 3px 6px rgba(0,0,0,.45)}
#refresh:hover{filter:brightness(1.06)}#refresh:active{transform:translateY(1px)}
#refresh .ri{font-size:24px;line-height:1;display:inline-block}
#refresh.busy{opacity:.75;cursor:progress}#refresh.busy .ri{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#rtime{font-size:13px;font-weight:700;color:#f6e7c4;text-shadow:0 1px 3px #000,0 0 6px #000;text-align:center;line-height:1.25}
#rtime.old{color:#ffd0c8}
#reset{position:absolute;left:478px;top:988px;z-index:9000;display:none;font:inherit;font-size:13px;font-weight:800;border:2px solid #b8861f;border-radius:10px;background:rgba(255,246,220,.92);color:#3a2412;padding:2px 10px;cursor:pointer}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.02)}}
@keyframes shake{0%,100%{transform:translate(0,2px) rotate(-1.4deg)}25%{transform:translate(-1.5px,0) rotate(-1.9deg)}50%{transform:translate(1.5px,2px) rotate(-1.1deg)}75%{transform:translate(-1px,1px) rotate(-1.7deg)}}

@keyframes hop{0%,100%{transform:translateY(0)}38%{transform:translateY(-14px)}76%{transform:translateY(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* 動きは各自バラバラ：速さ(--k)・始まり(--d)・向き(--s)・大きさ(--a)を、キャラごとに少しずつ変えている（renderChars） */

@keyframes typing{
  0%{transform:translate(0,0) rotate(0)}
  11%{transform:translate(calc(var(--s)*var(--a)*1px),calc(var(--a)*-.8px)) rotate(calc(var(--s)*.5deg))}
  23%{transform:translate(calc(var(--s)*var(--a)*.3px),calc(var(--a)*-.2px)) rotate(calc(var(--s)*.1deg))}
  37%{transform:translate(calc(var(--s)*var(--a)*-.9px),calc(var(--a)*.8px)) rotate(calc(var(--s)*-.6deg))}
  52%{transform:translate(calc(var(--s)*var(--a)*.6px),calc(var(--a)*-.5px)) rotate(calc(var(--s)*.3deg))}
  66%{transform:translate(calc(var(--s)*var(--a)*-.4px),calc(var(--a)*.4px)) rotate(calc(var(--s)*-.2deg))}
  81%{transform:translate(calc(var(--s)*var(--a)*1.1px),calc(var(--a)*-.9px)) rotate(calc(var(--s)*.6deg))}
  100%{transform:translate(0,0) rotate(0)}}
.ch.s-normal .art{animation:breathe calc(6s*var(--k,1)) ease-in-out var(--d,0s) infinite}
.ch.s-busy .art{animation:typing calc(.42s*var(--k,1)) linear var(--d,0s) infinite}
.ch.s-yawn .art{animation:yawnmove calc(5s*var(--k,1)) ease-in-out var(--d,0s) infinite}
.ch.s-sleep .art{animation:breathe calc(4.5s*var(--k,1)) ease-in-out var(--d,0s) infinite}
.ch.s-wait .art{animation:none}
.ch.s-done .art{animation:hop calc(1.1s*var(--k,1)) ease-in-out var(--d,0s) infinite}
.bubble{position:absolute;right:-22px;top:0;background:#ffe066;border:3px solid #6b4a00;border-radius:14px;padding:2px 10px;font-size:17px;font-weight:800;color:#4a3200;white-space:nowrap;animation:bob 2s ease-in-out infinite}

.check{position:absolute;right:14px;top:6px;width:36px;height:36px;border-radius:50%;background:#5ac26a;border:3px solid #222;color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center}

</style>

/* ===== 設定（ここを直せば動く） ===== */
/* 舞台：設計の基準は 1600×1020。窓の形に合わせて、**窓いっぱい**に広げる（黒い帯を出さん）。
   窓が横長なら、横に広がる（真ん中の床が広がる）。ボードもキャラも、この広がった全体の中で動かせる */
const DESIGN_W=1600, DESIGN_H=1020; let STAGE_W=DESIGN_W, STAGE_H=DESIGN_H;
const MID_L=468, RIGHT_W=270;                      /* 左の列の右端／右の完成品置き場の幅（設計） */

/* 設計の x（468〜1330）を、背景の絵の幅に合わせて、広げた舞台の x に（拡声器をやめて、左の列が空いたので、絵の全体を使う） */
const mx=x=>{ const g=bgGeom(); const R0=Math.max(30,g.left+.05*g.w), R1=Math.min(STAGE_W-RIGHT_W-30,g.left+.95*g.w); return R0+(x-468)/862*(R1-R0) };
/* 背景の写真（1125×844）を、舞台いっぱい（cover）に敷く。床の位置を計算して、席の高さを床に合わせる */
/* 床の上端は、写真の y≒560（漫画版の背景）。背景を差し替えたら、ここを直す（実写版 bg-photo.webp は y≒520） */
const FLOOR_Y=560, BG_W=1125, BG_H=844, FACE_SAFE=24;
/* 背景の絵の収め方：高さに収める（頭の上を切らん）。真ん中の窓（左のボードと右の完成品置き場の間）の幅も、埋める。
   どうしても縦が足りん（細長い窓）時だけ、下を切る（上は、顔の冠の手前＝約24pxまでしか切らん）。左右の足りん所は、ぼかした絵で埋める */
function bgGeom(){
  const mW=STAGE_W-RIGHT_W; const k=Math.max(STAGE_H/BG_H, .8*mW/BG_W);   /* 右の完成品置き場を除く、全幅の真ん中に置く */

}

               kiki:{sel:"#p-kiki",w:155,h:155,x:()=>{const g=bgGeom();return g.left+790*g.k-77},y:()=>{const g=bgGeom();return g.off+215*g.k-77},fixed:true},
               emi:{sel:"#p-emi",w:155,h:155,x:()=>{const g=bgGeom();return g.left+790*g.k-77},y:()=>{const g=bgGeom();return g.off+395*g.k-77},fixed:true} };

/* 状態→絵（すぎちゃん決定）：仕事の絵＝普通／焦り＝依頼作業中／あくび＝ヒマ／寝てる＝長らくヒマ・止まってる */
function look(id,s){
  if(NO_SLEEP.has(id)) return {pose:"normal",cls:"s-normal"};

  const lv=stallLevel(s); if(lv) return {pose:"sleep",cls:"s-sleep",stall:lv};

}

    removeEventListener("pointermove",mv); removeEventListener("pointerup",up); removeEventListener("pointercancel",up);
    if(moved){
      el.classList.remove("dragging"); DRAG.active=false; justDragged=true; setTimeout(()=>justDragged=false,80);
      if(isMana){MANA.dragging=false; MANA.userY=true; el.style.zIndex=Math.round(MANA.y)}
      else if(el._p){POS[id]=el._p; el.style.zIndex=el._p[1]; savePos()}
    }
  };
  addEventListener("pointermove",mv); addEventListener("pointerup",up); addEventListener("pointercancel",up);
});
/* キャラの大小：右下の「◢」をドラッグ（中心を動かさず、比率そのまま）。ホイールでも変えられる */
function setCs(id,cs){ if(SIZE_LOCKED.has(id)) return; cs=Math.max(CS_MIN,Math.min(CS_MAX,+cs.toFixed(3))); CSCALE[id]=cs; CS_SHOWN[id]=cs; savePos(); }
function startCharResize(e,el){
  e.preventDefault(); e.stopPropagation();
  if(SIZE_LOCKED.has(el.dataset.detail)) return;
  const id=el.dataset.detail, st=document.getElementById("stage").getBoundingClientRect(), isMana=id==="mana";
  const c=isMana?[MANA.x,MANA.y]:(POS[id]||seatXY(id));
  el.classList.add("sizing"); DRAG.active=true; let moved=false;
  const mv=ev=>{ moved=true; const mx=(ev.clientX-st.left)/SCALE, my=(ev.clientY-st.top)/SCALE;
    const cs=Math.max(CS_MIN,Math.min(CS_MAX,Math.max(Math.abs(mx-c[0]),Math.abs(my-c[1]))/70)); CSCALE[id]=cs; CS_SHOWN[id]=cs;
    el.style.width=140*cs+"px"; el.style.height=140*cs+"px"; el.style.left=(c[0]-70*cs)+"px"; el.style.top=(c[1]-70*cs)+"px"; };
  const up=()=>{ removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);
    el.classList.remove("sizing"); DRAG.active=false; if(moved){justDragged=true;setTimeout(()=>justDragged=false,80);savePos()} };
  addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up);
}
document.getElementById("chars").addEventListener("wheel",e=>{
  const el=e.target.closest(".ch"); if(!el||el.classList.contains("visitor")||SIZE_LOCKED.has(el.dataset.detail)) return;
  e.preventDefault(); const id=el.dataset.detail, cs=csOf(id)*(e.deltaY<0?1.1:1/1.1);
  setCs(id,cs); if(id!=="mana") renderChars(); },{passive:false});
document.getElementById("stage").addEventListener("dragstart",e=>e.preventDefault());
document.getElementById("reset").addEventListener("click",()=>{POS={};PANEL={};CSCALE={};MANA.userY=false;savePos();renderChars();applyPanels();placeRefresh();MANA.y=my(940)});
/* ----- ボード類：配置と大きさ。**縦と横は、別々に自由に変えられる**（比率は固定せん）。丸アイコンだけは、丸いので比率そのまま ----- */
const MIN_W=90, MIN_H=60;
function panelRect(id){   /* いまの x,y,w,h（保存が古い形 s の時は、倍率から換算） */
  const d=PANELS[id], st=PANEL[id]||{}, df=defXY(d);
  let w=st.w, h=st.h; if(w==null&&st.s){w=d.w*st.s} if(h==null&&st.s){h=d.h*st.s}
  w=w??d.w; h=h??d.h; return {x:st.x??df[0], y:st.y??df[1], w, h};
}
const clampRect=(d,r)=>{ const w=Math.max(d.fixed?30:MIN_W,Math.min(STAGE_W,r.w)), h=Math.max(d.fixed?30:MIN_H,Math.min(STAGE_H,r.h));
  return {x:Math.max(0,Math.min(STAGE_W-w,r.x)), y:Math.max(0,Math.min(STAGE_H-h,r.y)), w, h} };
function applyPanels(){
  for(const [id,d] of Object.entries(PANELS)){
    const el=document.querySelector(d.sel); if(!el) continue;
    const r=clampRect(d,panelRect(id));
    el.style.left=r.x+"px"; el.style.top=r.y+"px";
    if(d.fixed){ const sc=r.w/d.w; el.style.transform=`scale(${sc})`; el.style.transformOrigin="0 0" }   /* 丸アイコン：比率そのまま */
    else { el.style.width=Math.round(r.w)+"px"; el.style.height=Math.round(r.h)+"px" }
  }
}
let PZ=0;
for(const [id,d] of Object.entries(PANELS)){
  const el=document.querySelector(d.sel); if(!el) continue;
  { const rz=document.createElement("span"); rz.className="rz"; rz.title=d.fixed?"ドラッグで大きさを変える（丸いので、比率はそのまま）":"ドラッグで、縦横を別々に変える"; rz.textContent="◢"; el.appendChild(rz); }
  el.addEventListener("pointerdown",e=>{
    if(e.button>0) return;
    const onRz=e.target.closest(".rz");
    if(!onRz&&e.target.closest("textarea,select,input,a,label,#mcp,#dclose")) return;   /* 入力欄・ボタンは、そのまま使う */
    el.style.zIndex=String(2+(++PZ));   /* さわったボードを、いちばん手前に（キャラよりは奥） */
    const r0=panelRect(id), rect=document.getElementById("stage").getBoundingClientRect();
    const px=(e.clientX-rect.left)/SCALE, py=(e.clientY-rect.top)/SCALE, offX=px-r0.x, offY=py-r0.y;
    let moved=false;
    if(onRz) e.preventDefault();
    const mv=ev=>{
      const mx=(ev.clientX-rect.left)/SCALE, my=(ev.clientY-rect.top)/SCALE;
      if(!moved&&Math.hypot(ev.clientX-e.clientX,ev.clientY-e.clientY)<6) return;
      if(!moved){moved=true;DRAG.active=true;el.classList.add("pdrag")}
      let r;
      if(onRz){
        if(d.fixed){ const w=Math.max(30,Math.max(mx-r0.x,my-r0.y)); r={x:r0.x,y:r0.y,w,h:w*d.h/d.w}; }   /* 丸アイコンは正方形のまま */
        else r={x:r0.x,y:r0.y,w:mx-r0.x,h:my-r0.y};                                                         /* 縦横を別々に */
      }else r={x:mx-offX,y:my-offY,w:r0.w,h:r0.h};
      r=clampRect(d,r);
      PANEL[id]={x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.w),h:Math.round(r.h)}; applyPanels(); placeRefresh();
    };
    const up=()=>{
      removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);
      if(moved){el.classList.remove("pdrag");DRAG.active=false;justDragged=true;setTimeout(()=>justDragged=false,80);savePos()}
    };
    addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up);
  });
}
applyPanels();
savePos();
window.__ready=true; MANA.x=mx(860); MANA.y=my(940); placeRefresh();
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",2200)}
for(const k of ["kiki","emi"]) document.getElementById("p-"+k).addEventListener("click",()=>{
  if(justDragged) return;
  const l=((DATA.members||{}).partners||{})[k]||PARTNERS[k].link;
  okLink(l)?window.open(l,"_blank","noopener,noreferrer"):toast(`${PARTNERS[k].name}のリンク先は、まだ設定されていません`);
});

/* ===== ライブ読み込み（開いた時＋毎分。同じ場所→GitHubのmain→埋め込み） ===== */
const RAW="https://raw.githubusercontent.com/gattgati-wq/gacchigachi-floor/main/floor";
const jf=u=>fetch(bust(u),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
async function loadFrom(base){
  const mem=await (await fetch(bust(base+"/members.json"),{cache:"no-store"})).json();
  const got=await Promise.all(mem.members.map(m=>jf(`${base}/status/${m.id}.json`)));
  const prod=await jf(base+"/products.json");
  return {collected_at:new Date().toISOString(),members:mem,status:got.filter(Boolean),products:(prod&&prod.products)||[]};
}
const hhmmss=d=>new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",hourCycle:"h23",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(d);
let LIVE_OK=false, LOADING=false;
function paintRefresh(msg){
  const b=document.getElementById("refresh"), t=document.getElementById("rtime");
  b.classList.toggle("busy",LOADING); b.querySelector("b").textContent=LOADING?"更新中…":"更新";
  t.textContent=msg||`データ ${hhmmss(new Date(DATA.collected_at||Date.now()))} 時点${LIVE_OK?"":"（埋め込み＝古い可能性）"}`;
  t.classList.toggle("old",!LIVE_OK);
}
async function tryLive(){
  if(LOADING) return; LOADING=true; paintRefresh();
  const bases=location.protocol==="file:"?[RAW]:["..",RAW];
  let ok=false;
  for(const b of bases){ try{DATA=await loadFrom(b);SOURCE=b===RAW?"ライブ（GitHub main）":"ライブ";ok=true;break}catch(e){} }
  if(!ok) SOURCE="埋め込み（古い可能性あり）";
  LIVE_OK=ok; LOADING=false; draw(); paintRefresh();
}
function paintManaDoing(){ const el=MANA.el; if(!el) return; let d=el.querySelector(".doing"); const t=doingText("mana");
  if(!t){ if(d) d.remove(); return } if(!d){ d=document.createElement("span"); d.className="doing"; el.appendChild(d) } d.textContent=t }
function draw(){paintManaDoing();renderBoard();if(!DRAG.active)renderChars();renderProducts(DATA.products);window.__floor={source:SOURCE,members:members().length}}
function placeRefresh(){ const pl=document.getElementById("plate"), rb=document.getElementById("rbox"); if(!pl||!rb) return;
  const r=panelRect("plate"); rb.style.left=Math.max(4,Math.min(STAGE_W-190,r.x+(r.w-176)/2))+"px"; rb.style.top=(r.y+r.h+3)+"px"; }   /* 更新ボタンは、日時プレートの真下 */
/* 窓の大きさが変わった時：舞台を広げ直す */
function relayout(){
  applyPanels(); placeRefresh();
  if(!MANA.userY) MANA.y=my(940);
  MANA.x=Math.max(manaMin(),Math.min(manaMax(),MANA.x));
  renderChars();
}
document.getElementById("refresh").addEventListener("click",tryLive);   /* 今すぐ更新（自動は毎分） */
draw(); paintRefresh(); tryLive(); setInterval(tryLive,60000);
</script>
