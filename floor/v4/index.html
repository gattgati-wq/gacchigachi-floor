}
tick(); setInterval(tick,1000);

/* ===== 状態ボード ===== */
const COLS=[{k:"idle",t:"待機中"},{k:"working",t:"作業中"},{k:"wait",t:"承認待ち"},{k:"done",t:"完了"}];
function renderBoard(){
  const ms=members();
  document.getElementById("cols").innerHTML=COLS.map(c=>{
    const items=ms.filter(m=>colKey(stOf(m.id))===c.k).sort((a,b)=>(stallLevel(stOf(b.id))-stallLevel(stOf(a.id))));
    const MAX=4, shown=items.slice(0,MAX), more=items.length-shown.length;
    const mags=shown.map((m,i)=>{const [img,ink]=MAG[m.id]||["lavender","#111"], lv=stallLevel(stOf(m.id));
      return `<button class="mag" data-detail="${esc(m.id)}" style="top:${i*25}%;z-index:${i+1}"><img src="ui/mag-${img}.webp" alt=""><span style="color:${ink}">${esc(m.name)}${lv?`<i>⚠</i>`:""}</span></button>`}).join("");
    return `<div class="col">${mags}${more>0?`<span class="more">＋${more}</span>`:""}</div>`;
  }).join("");
}

/* ===== 拡声器ボード（試作：読むだけ。書く欄は未移植） ===== */
function renderMega(){
  const mg=DATA.megaphone||{}, m=mg.message, rs=mg.replies||[], ms=members();
  const got=new Set(rs.filter(r=>m&&r.msg_id===m.id).map(r=>r.id));
  const target=ms.filter(x=>!m||x.id!==m.from);
  const nOk=target.filter(x=>got.has(x.id)).length;
  document.getElementById("mview").innerHTML=`
    <div class="msg">${m?esc(m.text):"連絡はまだありません"}</div>
    <div class="meta">${m?`${esc(m.from_name||m.from)} ／ 返事 ${nOk}/${target.length}`:""}</div>
    <div class="rep">${m?target.map(x=>{const r=rs.find(y=>y.id===x.id&&y.msg_id===m.id);
      return `<div class="r ${r?"":"none"}" style="${r?`border-left-color:${COLORS[x.id]||"#888"}`:""}"><b>${esc(x.name)}</b>：${r?esc(r.text):"（未返信）"}</div>`}).join(""):""}</div>`;
}
/* 書く欄は一度だけ作る（毎分の再描画で入力が消えんように）。共有保存はできんので、コピーしてみーに渡す */
(function buildWrite(){
  document.getElementById("mega").innerHTML=`<div class="in"><h2>拡声器</h2><div id="mview" style="display:flex;flex-direction:column;gap:8px;min-height:0;flex:1 1 auto;overflow:hidden"></div>
   <div class="write"><label>送る人 <select id="mfrom"><option value="chairman">すぎちゃん</option><option value="mii">みー</option></select></label>
   <textarea id="mtext" placeholder="全員への連絡・質問を書く"></textarea>
   <div class="wb"><button id="mcp">コピー（みーに渡す用）</button><span id="mmsg">共有保存はできんので、みーが置く</span></div></div></div>`;
  document.getElementById("mcp").onclick=async()=>{
    const t=document.getElementById("mtext").value.trim(), f=document.getElementById("mfrom").value, msg=document.getElementById("mmsg");
    if(!t){msg.textContent="文章が空やで";return}
    const o=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date()).map(p=>[p.type,p.value]));
    const obj={id:`${o.year}${o.month}${o.day}-${o.hour}${o.minute}`,from:f,from_name:f==="mii"?"みー":"すぎちゃん",text:t,sent:`${o.year}-${o.month}-${o.day}T${o.hour}:${o.minute}:${o.second}+09:00`};
    const txt="【拡声器】floor/megaphone/current.json に置く\n"+JSON.stringify(obj,null,2);
    try{await navigator.clipboard.writeText(txt);msg.textContent="コピーした ✔ みーに渡してな"}catch(e){msg.textContent="コピーできんかった（ブラウザの設定を確認）"}
  };
})();

/* ===== 完成品置き場（名前だけ。みーが products.json に書く） ===== */
function renderProducts(list){
  document.getElementById("plist").innerHTML=list&&list.length
    ? `<div class="names">${list.map(n=>`<span>${esc(n)}</span>`).join("")}</div>`
    : `<div class="none">まだ置いてありません</div>`;
}

/* ===== キャラ ===== */
const FRAME={}; /* 2コマの子の現在のコマ */
function renderChars(){
  const box=document.getElementById("chars");
  const html=members().filter(m=>SEAT[m.id]).map(m=>{
    const [cx,cy]=SEAT[m.id], s=stOf(m.id), L=look(m.id,s);
    const f=TWO_FRAME[m.id]&&(L.pose==="normal"||L.pose==="busy")&&FRAME[m.id]?"2":"";
    return `<button class="ch ${L.cls}" data-detail="${esc(m.id)}" style="left:${cx-70}px;top:${cy-70}px;z-index:${cy}" aria-label="${esc(m.name)}">
      <img class="art" data-id="${esc(m.id)}" data-pose="${L.pose}" src="img/${esc(m.id)}-${L.pose}${f}.webp" alt="">
      ${L.bubble?`<span class="bubble">許可まち</span>`:""}${L.check?`<span class="check">✓</span>`:""}
      ${L.stall?`<span class="stall">⚠${ageText(ageMs(s))}</span>`:""}<span class="tag">${esc(m.title||m.role||m.name)}</span></button>`;
  }).join("");
  box.querySelectorAll(".ch:not(.mana)").forEach(e=>e.remove());
  box.insertAdjacentHTML("afterbegin",html);
}
/* 2コマの子（親方）：コマを切り替える */
if(!REDUCED) setInterval(()=>{
  document.querySelectorAll('img.art').forEach(img=>{
    const id=img.dataset.id; if(!TWO_FRAME[id]) return;
    const p=img.dataset.pose; if(p!=="normal"&&p!=="busy") return;
    FRAME[id]=!FRAME[id]; img.src=`img/${id}-${p}${FRAME[id]?"2":""}.webp`;
  });
},450);

/* ===== まな：フロアを往復して歩く（統括は聞き回る） ===== */
const MANA={x:860,y:915,dir:1,mode:"walk",t:0,frame:0};
const MANA_MIN=760, MANA_MAX=1260, MANA_SPEED=70;
(function buildMana(){
  const b=document.createElement("button"); b.className="ch mana s-normal"; b.dataset.detail="mana"; b.setAttribute("aria-label","まな");
  b.innerHTML=`<img class="art" id="manaImg" src="img/mana-walk1.webp" alt=""><span class="tag">${esc((members().find(x=>x.id==="mana")||{}).title||"まな")}</span>`;
  document.getElementById("chars").appendChild(b); MANA.el=b; MANA.img=b.querySelector("img");
  paintMana();
})();
function paintMana(){
  const e=MANA.el;
  e.style.left=(MANA.x-70)+"px"; e.style.top=(MANA.y-70)+"px"; e.style.zIndex=Math.round(MANA.y);
  /* ③④は左向き。右へ行く時は反転 */
  e.classList.toggle("flip", MANA.mode==="walk" && MANA.dir>0);
  const name = MANA.mode==="wave" ? "wave" : (MANA.frame? "walk2":"walk1");
  const src=`img/mana-${name}.webp`;
  if(MANA.img.getAttribute("src")!==src) MANA.img.setAttribute("src",src);
  e.querySelector(".art").style.animation = MANA.mode==="wave" ? "breathe 3s ease-in-out infinite" : "none";
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  if(!REDUCED){
    if(MANA.mode==="walk"){
      MANA.x+=MANA.dir*MANA_SPEED*dt; MANA.t+=dt; MANA.frame=Math.floor(MANA.t/.28)%2;
      if(MANA.x>=MANA_MAX){MANA.x=MANA_MAX;MANA.mode="wave";MANA.t=0;MANA.dir=-1}
      else if(MANA.x<=MANA_MIN){MANA.x=MANA_MIN;MANA.mode="wave";MANA.t=0;MANA.dir=1}
    }else{ MANA.t+=dt; if(MANA.t>2.2){MANA.mode="walk";MANA.t=0} } /* 端で手を振って、折り返す */
  }else{ MANA.mode="wave"; MANA.x=1100; }
  paintMana(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ===== 詳細ウインドウ（「会いに行く」リンク：members.json の link／https のみ） ===== */
const okLink=u=>typeof u==="string"&&/^https:\/\//i.test(u);
function openDetail(id){
  const m=members().find(x=>x.id===id); if(!m) return;
  const s=stOf(id), lv=stallLevel(s);
  const link=m.link;
  document.getElementById("dbox").innerHTML=`<h3>${esc(m.name)}（${esc(m.title||m.role||"")}）</h3>
   <dl><dt>状態</dt><dd>${s?esc(STATUS_LABEL[s.status]||s.status):"状態ファイルなし"}${lv?`　⚠${ageText(ageMs(s))}止まってる`:""}</dd>
   <dt>タスク</dt><dd>${esc(s&&s.task||"—")}</dd><dt>ひとこと</dt><dd>${esc(s&&s.say||"—")}</dd>
   <dt>何待ち</dt><dd>${s&&s.waiting_for?esc(s.waiting_for):"—"}</dd>
   <dt>最終更新</dt><dd>${s&&s.updated?esc(s.updated.replace("T"," ").slice(0,16)):"—"}</dd></dl>
   <div class="acts">${okLink(link)?`<a class="go" href="${esc(link)}" target="_blank" rel="noopener noreferrer">会いに行く</a>`:""}<button id="dclose">閉じる</button></div>`;
  document.getElementById("dlg").classList.add("open");
  document.getElementById("dclose").focus();
}
const closeDlg=()=>document.getElementById("dlg").classList.remove("open");
document.getElementById("dlg").addEventListener("click",e=>{if(e.target.id==="dlg"||e.target.id==="dclose")closeDlg()});
addEventListener("keydown",e=>{if(e.key==="Escape")closeDlg()});
document.addEventListener("click",e=>{const d=e.target.closest("[data-detail]"); if(d) openDetail(d.dataset.detail)});
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",2200)}
for(const k of ["kiki","emi"]) document.getElementById("p-"+k).addEventListener("click",()=>{
  const l=((DATA.members||{}).partners||{})[k]||PARTNERS[k].link;
  okLink(l)?window.open(l,"_blank","noopener,noreferrer"):toast(`${PARTNERS[k].name}のリンク先は、まだ設定されていません`);
});

/* ===== ライブ読み込み（開いた時＋毎分。同じ場所→GitHubのmain→埋め込み） ===== */
const RAW="https://raw.githubusercontent.com/gattgati-wq/gacchigachi-floor/main/floor";
const jf=u=>fetch(u,{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
async function loadFrom(base){
  const mem=await (await fetch(base+"/members.json",{cache:"no-store"})).json();
  const got=await Promise.all(mem.members.map(m=>jf(`${base}/status/${m.id}.json`)));
  const message=await jf(base+"/megaphone/current.json");
  const replies=(await Promise.all(mem.members.map(m=>jf(`${base}/megaphone/replies/${m.id}.json`)))).filter(Boolean);
  const prod=await jf(base+"/products.json");
  return {collected_at:new Date().toISOString(),members:mem,status:got.filter(Boolean),megaphone:{message,replies},products:(prod&&prod.products)||[]};
}
async function tryLive(){
  const bases=location.protocol==="file:"?[RAW]:["..",RAW];
  for(const b of bases){ try{DATA=await loadFrom(b);SOURCE=b===RAW?"ライブ（GitHub main）":"ライブ";draw();return}catch(e){} }
  SOURCE="埋め込み（古い可能性あり）"; draw();
}
function draw(){renderBoard();renderChars();renderMega();renderProducts(DATA.products);window.__floor={source:SOURCE,members:members().length}}
draw(); tryLive(); setInterval(tryLive,60000);
</script>
