<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ガッチ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e6137">
<title>ガッチ パネル</title>
<style>
  :root{
    /* 色は予約システムのCSSから（みーが取得） */
    --bg:#0e6137;      /* 背景：予約システムのグリーン */
    --btn:#d9ab52;     /* ボタン：予約システムの黄土色 */
    --btn-on:#c4963f;  /* 押した時（まなが決めた少し濃い黄土色） */
    --brown:#573a29;   /* ボタンの文字と枠：予約システムの茶色 */
    --ink:#f6efe0; --sub:#cfe3d6;
    --gap:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;overflow:hidden}
  main{height:100dvh;display:flex;flex-direction:column;
    padding:max(env(safe-area-inset-top),20px) 16px max(env(safe-area-inset-bottom),20px)}
  h1{margin:0 0 14px;font-size:13px;font-weight:500;letter-spacing:.2em;color:var(--sub)}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;
    grid-template-rows:repeat(3,1fr);gap:var(--gap)}
  .grid a{display:flex;align-items:center;justify-content:center;text-align:center;
    background:var(--btn);color:var(--brown);text-decoration:none;
    border:3px solid var(--brown);box-shadow:none;
    border-radius:12px;font-size:clamp(20px,6vw,26px);font-weight:700;letter-spacing:.04em;
    user-select:none;-webkit-user-select:none}
  .grid a:active,.grid a.on{background:var(--btn-on)}
  .grid a.wide{grid-column:1 / -1}
  .err{height:18px;margin-top:10px;font-size:12px;color:#fff3d6;text-align:center;visibility:hidden}
  .err.show{visibility:visible}
</style>
</head>
<body>
<main>
  <h1>ガっチガチ研究所</h1>
  <nav class="grid" id="grid"></nav>
  <div class="err" id="err">つながらん。ショートカットの名前を確認してな</div>
</main>
<script>
/* ===== 設定：ここだけ直せば動く =====
   name   … 画面のボタン名（scenes.md の呼び名と同じ）
   shortcut … iPhoneの「ショートカット」アプリに作った名前（動作は「ホーム → シーンを実行」）
   将来、HA版に差し替える時は、この配列の href だけ入れ替える。 */
const SCENES = [
  { name:"仕事だよ",   shortcut:"仕事だよ" },
  { name:"おはよう",   shortcut:"おはよう" },
  { name:"おやすみ",   shortcut:"おやすみ" },
  { name:"明るくして", shortcut:"明るくして" },
  { name:"作業モード", shortcut:"作業モード", wide:true },
];
const grid = document.getElementById("grid");
for (const s of SCENES) {
  const a = document.createElement("a");
  a.textContent = s.name;
  if (s.wide) a.className = "wide";
  a.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(s.shortcut);
  a.addEventListener("click", () => {
    a.classList.add("on");
    setTimeout(() => a.classList.remove("on"), 250);
  });
  grid.appendChild(a);
}
</script>
</body>
</html>
