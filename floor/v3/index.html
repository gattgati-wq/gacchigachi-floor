<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>ガっチガチ研究所 フロア</title>
<style>
:root{
  color-scheme: only light;
  --bg:#fbf6ea; --ink:#1b1b1b; --line:#111; --paper:#fff; --muted:#6b6b6b;
  --thick:4px; --gap:8px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif}
body{height:100vh;height:100dvh;padding:var(--gap);overflow:hidden}
button{font:inherit;color:inherit}

/* ===== 一画面レイアウト ===== */
.app{height:100%;display:grid;grid-template-columns:minmax(300px,34%) 1fr;gap:var(--gap);min-height:0}
.side{display:flex;flex-direction:column;gap:var(--gap);min-height:0;min-width:0;overflow:auto}
.floor{min-height:0;min-width:0}
.sec{background:var(--paper);border:var(--thick) solid var(--line);border-radius:6px;padding:6px;min-width:0}

/* ===== 警告帯 ===== */
.alert{display:none;background:#d62828;color:#fff;border:var(--thick) solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:800}
.alert.on{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.alert button{border:2px solid #111;background:#fff;color:#111;border-radius:4px;padding:0 6px;font-size:12px;font-weight:700;cursor:pointer}

/* ===== 状態ボード（名前だけ・3列） ===== */
.board{display:grid;grid-template-columns:repeat(3,1fr);border:var(--thick) solid var(--line);background:#fff;flex:0 0 auto}
.col{border-left:var(--thick) solid var(--line);display:flex;flex-direction:column;min-width:0}
.col:first-child{border-left:0}
.col h3{margin:0;padding:2px;text-align:center;font-size:12px;border-bottom:var(--thick) solid var(--line);background:#f4f4f4}
.col h3 small{font-weight:400;color:var(--muted)}
.cards{padding:4px;display:flex;flex-direction:column;gap:4px;min-height:30px}
.card{display:flex;align-items:center;justify-content:space-between;gap:4px;width:100%;text-align:left;border:2px solid var(--line);border-radius:3px;padding:2px 6px;cursor:pointer;
  box-shadow:1px 2px 0 rgba(0,0,0,.35);font-size:12px;font-weight:800;line-height:1.3}
.card.stall{border-color:#d62828;box-shadow:0 0 0 2px #fff,0 0 0 4px #d62828}
.card i{font-style:normal;background:#d62828;color:#fff;border:1.5px solid #111;border-radius:3px;font-size:10px;padding:0 3px;white-space:nowrap}
.card i.l1{background:#ff9800;color:#111}

/* ===== カレンダー＋時計 ===== */
.calrow{display:flex;gap:var(--gap);align-items:stretch;flex:0 0 auto}
.cal{flex:1;min-width:0}
.calt{font-size:12px;font-weight:800;margin-bottom:2px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;font-size:11px}
.calgrid .dow{font-size:10px;font-weight:700}
.calgrid .d{padding:2px 0;border-radius:3px;color:#222;line-height:1.2}
.calgrid .o{color:#bbb}
.calgrid .sat{color:#1c63c9}.calgrid .sun{color:#d33}
.calgrid .o.sat,.calgrid .o.sun{opacity:.45}
.calgrid .today{background:#d62828;color:#fff;font-weight:800;outline:2px solid #111;outline-offset:-1px}
.clk{flex:0 0 auto;width:clamp(110px,12vw,160px);padding:4px;display:flex;align-items:center;justify-content:center}
.clk svg{width:100%;height:auto;display:block}

/* ===== 小さいマス（会長室・取引先） ===== */
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);flex:0 0 auto}
.mini{display:flex;align-items:center;gap:6px;background:var(--tint,#eee);border:var(--thick) solid var(--line);border-radius:6px;padding:3px 6px;min-width:0}
.mini svg{flex:0 0 72px;width:72px;height:auto}
.mini .t{min-width:0;font-size:11px;line-height:1.35}
.mini .t b{display:block;font-size:12px}
.mini .t span{white-space:nowrap}
.mini.vip{border-style:double}
.mini.vip svg{flex-basis:44px;width:44px}
.redtag{display:inline-block;background:#d62828;color:#fff;border:2px solid #111;border-radius:3px;font-size:10px;font-weight:800;padding:0 4px;margin-left:3px}

/* ===== 拡声器 ===== */
.mega{background:#fff8d6;border:var(--thick) solid var(--line);border-radius:6px;display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.msum{cursor:pointer;padding:5px 8px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;user-select:none}
.mgbody{flex:1;padding:0 8px 8px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:6px}
.write{border:2px solid #111;border-radius:6px;background:#fff;padding:6px}
.mega select{border:2px solid #111;border-radius:4px;padding:2px 4px;font:inherit;font-size:13px;background:#fff;color:#111}
.msg{border:3px solid #111;border-radius:6px;background:#fff;padding:5px 8px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.msg.fill{flex:1}
.msg small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.rp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px}
.rpc{display:block;text-align:left;border:2px solid #111;border-radius:4px;padding:3px 6px;font-size:12px;background:var(--c);cursor:pointer;min-width:0;word-break:break-word}
.rpc b{display:block;font-size:12px}
.rpc small{display:block;font-size:10px;color:#333}
.rpc.none{background:#fff;border:3px dashed #d62828}
.rpc.none b{color:#d62828}
.cnt{display:inline-block;border:2px solid #111;border-radius:10px;background:#fff;padding:0 8px;font-size:12px;font-weight:800}
.cnt:empty{display:none}
.cnt.bad{background:#d62828;color:#fff}
textarea{width:100%;min-height:64px;border:2px solid #111;border-radius:4px;padding:6px;font:inherit;font-size:14px;background:#fff;color:var(--ink);resize:vertical}
.btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid #111;background:var(--c,#ddd);border-radius:4px;padding:4px 12px;font-weight:700;cursor:pointer}
.btn.w{background:#fff}
.hint{font-size:11px;color:var(--muted)}

.foot{font-size:10px;color:var(--muted);flex:0 0 auto}

/* ===== オフィス（デスクに座る） ===== */
.floor{position:relative;display:flex;flex-wrap:wrap;align-content:space-evenly;justify-content:center;gap:6px;padding:8px;overflow:auto;
  border:var(--thick) solid var(--line);border-radius:8px;--cs:clamp(120px,min(16vw,21vh),200px);
  background:repeating-linear-gradient(90deg,#f3e6cf 0 70px,#ecdcc0 70px 72px)}
/* 仕事ごとのまとまり（ゾーン）：同じ仕事の子が近くに座る */
.zone{position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;align-content:flex-start;padding:26px 10px 8px;border-radius:16px;background:rgba(255,255,255,.30);flex:0 1 auto}
.zone.nolabel{background:none;padding:6px;flex:1 1 100%}
.zlabel{position:absolute;left:12px;top:5px;background:#fff;border:2px solid #111;border-radius:10px;padding:0 9px;font-size:clamp(10px,1vw,13px);font-weight:800;line-height:1.5;white-space:nowrap}
.desk{position:relative;z-index:1;flex:0 0 auto;width:calc(var(--cs)*1.1);height:calc(var(--cs)*1.3);cursor:pointer;outline:none}
.plantf{flex:0 0 auto;width:clamp(30px,4vw,56px);align-self:flex-end;margin:0 6px 16px;pointer-events:none}
.plantf svg{display:block;width:100%;height:auto}
.desk:focus-visible .stage{outline:3px solid #1c63c9;border-radius:8px}
.stage{position:absolute;left:50%;top:50%;width:var(--cs);height:var(--cs);transform:translate(-50%,-46%)}
.char{position:absolute;left:0;bottom:5%;width:100%;height:93%;object-fit:contain;object-position:center bottom}
.stage>svg.person{position:absolute;inset:0;width:100%;height:100%;max-width:none;margin:0}
.stage>.under{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap}
.cap{display:flex;align-items:center;gap:4px;font-size:clamp(9px,.85vw,11px);font-weight:700;color:#333}
.cap .bar{width:clamp(54px,6vw,84px);height:9px;border:2px solid #111;border-radius:5px;background:#fff;overflow:hidden}
.cap .bar i{display:block;height:100%;background:var(--c)}
.cap.hot .bar i{background:#d62828}.cap.warm .bar i{background:#ff9800}.cap.old .bar i{background:#bbb}
.usage{display:grid;grid-template-columns:7em 1fr;gap:4px 8px;font-size:13px;margin-top:2px}
.usage .bar{height:12px;border:2px solid #111;border-radius:6px;background:#fff;overflow:hidden;margin-top:3px}
.usage .bar i{display:block;height:100%;background:var(--c)}
.nomeasure{font-size:12px;color:var(--muted)}
.deskf{z-index:2;position:absolute;left:4%;right:4%;bottom:3%;height:19%;border:3px solid #111;border-radius:10px 10px 4px 4px;
  background:linear-gradient(#e0b987 0 42%,#b88a58 42% 100%);display:flex;justify-content:center;align-items:flex-start;gap:6px;padding-top:2.5%}
.desk.work .deskf{height:13%}
.desk.nodesk .deskf{display:none}
.plate{margin-top:-1px;background:var(--c);border:2px solid #111;border-radius:3px;font-weight:800;font-size:clamp(10px,1vw,13px);padding:0 7px;white-space:nowrap;line-height:1.35;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.plate.warn{border-color:#d62828;box-shadow:0 0 0 2px #fff,0 0 0 4px #d62828}
.pb{background:#d62828;color:#fff;border:2px solid #111;border-radius:3px;font-size:clamp(9px,.9vw,12px);font-weight:800;padding:0 5px;line-height:1.35;white-space:nowrap}
.pb.l1{background:#ff9800;color:#111}
.ck{position:absolute;top:2%;right:12%;width:clamp(18px,2.4vw,30px);aspect-ratio:1;border-radius:50%;background:#5ac26a;border:2px solid #222;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,1.6vw,18px)}
.bubble{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(50% + var(--cs)/2 - 18px);width:min(94%,270px);background:#fff;border:3px solid #111;border-radius:12px;padding:5px 8px;font-size:12px;line-height:1.4;z-index:20;box-shadow:2px 3px 0 rgba(0,0,0,.3)}
.bubble.open{display:block}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top:11px solid #111;border-bottom:0}
.bubble small{display:block;color:var(--muted);font-size:10px}
.bubble .wt{display:inline-block;background:#fff3c4;border:2px solid #111;border-radius:4px;padding:0 4px;margin-top:2px;font-size:11px}
.bubble button{margin-top:3px;border:2px solid #111;background:var(--c);border-radius:4px;padding:0 8px;font-size:11px;font-weight:700;cursor:pointer}

/* ===== 詳細ウインドウ ===== */
dialog{border:var(--thick) solid var(--line);border-radius:8px;padding:0;width:min(520px,94vw);max-height:92vh;background:#fff;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:var(--thick) solid var(--line);background:var(--c)}
.dh b{font-size:17px}
.x{border:2px solid #111;background:#fff;border-radius:4px;font-size:16px;padding:0 10px;cursor:pointer}
.db{padding:10px 12px;overflow:auto;max-height:calc(92vh - 60px)}
dl{margin:0;display:grid;grid-template-columns:7em 1fr;gap:6px 8px;font-size:14px}
dt{font-weight:700;color:#444}dd{margin:0;word-break:break-word}
.wait{background:#fff3c4;border:2px solid #111;border-radius:4px;padding:2px 6px;display:inline-block}
.badge{display:inline-block;background:#d62828;color:#fff;border:1.5px solid #111;border-radius:3px;font-size:10px;font-weight:800;padding:0 4px}
.badge.l1{background:#ff9800;color:#111}
.db h4{margin:12px 0 4px;font-size:13px}
ul.jobs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
ul.jobs li{border:2px solid #111;border-radius:4px;padding:3px 7px;font-size:13px;background:#fafafa}
ul.jobs li b{margin-right:6px}

/* ===== 動き（うるさくない程度） ===== */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes steam{0%{opacity:0;transform:translateY(2px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-6px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes zz{0%,100%{opacity:.2}50%{opacity:1}}
.a-bob{animation:bob 3.2s ease-in-out infinite}
.a-steam{animation:steam 2.4s ease-in-out infinite}
.a-blink{animation:blink 1.2s ease-in-out infinite}
.a-zz{animation:zz 2s ease-in-out infinite}
/* キャラの動き（ポーズごと。子ごとに位相をずらして、揃って動かないようにする） */
.char{transform-origin:50% 100%;animation-delay:var(--dl,0s)}
@keyframes typing{0%,100%{transform:translate(0,2px) rotate(-1.4deg) scale(1.05)}20%{transform:translate(-.8px,.4px) rotate(-1.9deg) scale(1.055)}45%{transform:translate(.8px,2px) rotate(-1.1deg) scale(1.05)}70%{transform:translate(-.5px,1px) rotate(-1.7deg) scale(1.055)}}
@keyframes shake{0%,70%,100%{transform:translateX(0)}78%{transform:translateX(-2px) rotate(-.8deg)}86%{transform:translateX(2px) rotate(.8deg)}94%{transform:translateX(-1px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.02)}}
@keyframes yawnmove{0%,60%,100%{transform:scale(1,1)}75%{transform:scale(1.02,1.035) translateY(-1px)}}
@keyframes floatz{0%{opacity:0;transform:translate(0,6px) scale(.7)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-18px) scale(1.1)}}
.desk.p-work .char{animation:typing .38s linear infinite,sideshake .26s linear infinite}
/* 横方向のカタカタ（左右に小刻み）。translate は transform と別に重ねられる */
@keyframes sideshake{0%,100%{translate:0 0}25%{translate:calc(var(--cs)*-.022) 0}50%{translate:0 0}75%{translate:calc(var(--cs)*.022) 0}}
/* 頑張ってる演出：集中線・汗・カタカタ（仕事中だけ） */
.rush{position:absolute;inset:-14%;border-radius:50%;pointer-events:none;z-index:0;
  background:repeating-conic-gradient(from 0deg,rgba(0,0,0,.16) 0 2.2deg,transparent 2.2deg 11deg);
  -webkit-mask-image:radial-gradient(circle,transparent 38%,#000 66%,transparent 96%);mask-image:radial-gradient(circle,transparent 38%,#000 66%,transparent 96%);
  animation:rushp .9s steps(2) infinite}
@keyframes rushp{0%{opacity:.55;transform:rotate(0)}50%{opacity:.85;transform:rotate(4deg)}100%{opacity:.55;transform:rotate(0)}}
.desk.p-work .char{position:absolute;z-index:1}
.sweat{position:absolute;pointer-events:none;z-index:3;width:clamp(8px,1vw,13px);aspect-ratio:.7;background:#7fd3ff;border:2px solid #1b4a6b;border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;opacity:0;animation:sweatd 1.5s ease-in infinite}
.sweat.s1{top:12%;right:16%}
.sweat.s2{top:18%;left:14%;animation-delay:.7s}
@keyframes sweatd{0%{opacity:0;transform:translateY(-4px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1)}85%{opacity:1;transform:translateY(clamp(10px,1.6vw,22px)) scale(.95)}100%{opacity:0;transform:translateY(clamp(14px,2vw,28px)) scale(.8)}}
.kata{position:absolute;left:-14%;top:44%;z-index:3;pointer-events:none;font-weight:900;font-size:clamp(9px,1vw,13px);color:#111;white-space:nowrap;
  -webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:0 0 2px #fff;animation:kata .76s steps(1) infinite;transform-origin:left center}
.kata.k2{left:auto;right:-14%;top:50%;animation-delay:.38s}
@keyframes kata{0%{opacity:1;transform:rotate(-8deg) scale(1)}50%{opacity:.15;transform:rotate(-4deg) scale(.85)}}
.desk.p-panic .char{animation:shake 1.6s ease-in-out infinite}
.desk.p-yawn .char{animation:yawnmove 5s ease-in-out infinite}
.desk.p-sleep .char{animation:breathe 4.5s ease-in-out infinite}
.desk.p-normal .char{animation:breathe 6s ease-in-out infinite,hop 9s ease-in-out infinite}
/* 完了＝ヒマ：「仕事ちょうだい」と、9秒に1回だけ小さく2回ぴょこぴょこ跳ねる（あとはじっとしてる） */
@keyframes hop{0%,16%,100%{translate:0 0}3%{translate:0 calc(var(--cs)*-.07)}6%{translate:0 0}9%{translate:0 calc(var(--cs)*-.05)}12%{translate:0 0}}
.zz{position:absolute;top:6%;right:14%;font-weight:800;color:#444;pointer-events:none}
.zz i{position:absolute;font-style:normal;font-size:clamp(11px,1.3vw,16px);opacity:0;animation:floatz 3s ease-in-out infinite}
.zz i:nth-child(2){animation-delay:1.4s;font-size:clamp(9px,1vw,13px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ===== PC：サマリーは常に開いたまま ===== */
@media (min-width:761px) and (orientation:landscape){
  .msum{pointer-events:none}
}

/* ===== スマホ・縦長：同じ見せ方で縦に積む（多少のスクロールはあり） ===== */
@media (max-width:760px), (orientation:portrait){
  body{height:auto;overflow:auto;padding:5px}
  .app{display:flex;flex-direction:column;gap:5px;height:auto}
  .side{display:contents}
  .alert{order:1}.board{order:2}.calrow{order:3}.minis{order:4}.mega{order:5}
  .floor{order:6;flex:none;overflow:visible;--cs:clamp(76px,25vw,112px)}
  .desk{width:calc(var(--cs)*1.18)}
  .zone{padding:24px 4px 6px}
  .foot{order:7}
  :root{--thick:3px;--gap:5px}
  .col h3{font-size:11px}
  .cards{padding:3px;gap:3px;min-height:26px}
  .card{font-size:11px;padding:1px 4px}
  .calgrid{font-size:10px}.calgrid .d{padding:1px 0}
  .calt{font-size:11px}
  .clk{width:96px}
  .mini{padding:2px 4px;gap:4px}.mini svg{flex-basis:52px;width:52px}.mini.vip svg{flex-basis:32px;width:32px}.mini .t{font-size:9.5px}.mini .t b{font-size:11px}
  .mega{flex:0 0 auto}
  .mega .mgbody{display:none}
  .mega.open{position:fixed;inset:6px;z-index:60;overflow:auto}
  .mega.open .mgbody{display:flex}
  .pbx{display:none}
  .plate{font-size:10px;padding:0 4px}
  .pb{font-size:9px;padding:0 3px}
  .floor{padding:3px}
  .deskf{border-width:2px}
  dl{grid-template-columns:6em 1fr}
}
/* 縦が極端に短い横向きスマホ：スクロールを許す */
@media (max-height:480px){
  body{height:auto;overflow:auto}.app{height:auto}.floor{overflow:visible}
}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <div class="alert" id="alert"></div>
    <div class="board" id="board"></div>
    <div class="calrow"><section class="sec cal" id="cal"></section><section class="sec clk" id="clk"></section></div>
    <div class="minis" id="minis"></div>
    <section class="mega" id="mega"></section>
    <div class="foot" id="foot"></div>
  </div>
  <div class="floor" id="floor"></div>
</div>

<script>

function stallLevel(s){

/* 使用量：各メンバーが自分の状態ファイルに書いた usage（自己申告）。無ければ「未計測」。推測では出さない */

  const f=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric",weekday:"short"});
  const o={}; f.formatToParts(d).forEach(p=>o[p.type]=p.value);
  return {y:+o.year,mo:+o.month,d:+o.day,h:+o.hour,mi:+o.minute,s:+o.second,w:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(o.weekday)};
}
function fmtTime(iso){

}
function waitText(s){

/* 状態→ポーズ：仕事中＝作業中／焦ってる＝許可待ち・人待ち／寝てる＝止まってる・状態ファイルなし・待機が長い／あくび＝待機／通常＝完了 */
function poseOf(s){

    if(!t){document.getElementById("mmsg").textContent="文章が空やで";return}
    const j=jst(), p=n=>String(n).padStart(2,"0");
    const obj={id:`${j.y}${p(j.mo)}${p(j.d)}-${p(j.h)}${p(j.mi)}`,from:f,from_name:f==="mii"?"みー":"すぎちゃん",text:t,sent:`${j.y}-${p(j.mo)}-${p(j.d)}T${p(j.h)}:${p(j.mi)}:${p(j.s)}+09:00`};
    const txt=`【拡声器】floor/megaphone/current.json に置く\n`+JSON.stringify(obj,null,2);
    try{await navigator.clipboard.writeText(txt);document.getElementById("mmsg").textContent="コピーした ✔ みーに渡してな"}
    catch(e){document.getElementById("mmsg").textContent="コピーできんかった（ブラウザの設定を確認）"}
  };
  document.getElementById("msum").onclick=()=>mega.classList.toggle("open"); /* スマホ：帯を押すと全面に開く／もう一度で閉じる（PCは常に表示） */
}

/* ===== カレンダー ===== */
function renderCal(){
  const t=jst(), first=new Date(Date.UTC(t.y,t.mo-1,1)), dim=new Date(Date.UTC(t.y,t.mo,0)).getUTCDate();
  const lead=first.getUTCDay(), prevDim=new Date(Date.UTC(t.y,t.mo-1,0)).getUTCDate();
  const weeks=Math.ceil((lead+dim)/7), cells=[];
  for(let i=0;i<weeks*7;i++){
    const dow=i%7, day=i-lead+1; let n=day, o=false;
    if(day<1){n=prevDim+day;o=true} else if(day>dim){n=day-dim;o=true}
    cells.push(`<div class="${["d",o?"o":"",dow===0?"sun":dow===6?"sat":"",(!o&&day===t.d)?"today":""].join(" ")}">${n}</div>`);
  }
  document.getElementById("cal").innerHTML=`<div class="calt">${t.y}年${t.mo}月</div>
   <div class="calgrid">${[..."日月火水木金土"].map((w,i)=>`<div class="dow ${i==0?"sun":i==6?"sat":""}">${w}</div>`).join("")}${cells.join("")}</div>`;
}

/* ===== 時計（丸いアナログだけ） ===== */
function buildClock(){
  let ticks="",nums="";
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,big=i%5===0,r1=big?80:86;
    ticks+=`<line x1="${100+Math.sin(a)*r1}" y1="${100-Math.cos(a)*r1}" x2="${100+Math.sin(a)*92}" y2="${100-Math.cos(a)*92}" stroke="#111" stroke-width="${big?3:1}"/>`}
  for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;
    nums+=`<text x="${100+Math.sin(a)*66}" y="${100-Math.cos(a)*66+6}" font-size="17" font-weight="700" text-anchor="middle" fill="#111">${i}</text>`}
  document.getElementById("clk").innerHTML=`<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="97" fill="#fff" stroke="#111" stroke-width="5"/>${ticks}${nums}
   <line id="hH" x1="100" y1="100" x2="100" y2="55" stroke="#111" stroke-width="7" stroke-linecap="round"/>
   <line id="hM" x1="100" y1="100" x2="100" y2="35" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>
   <line id="hS" x1="100" y1="112" x2="100" y2="28" stroke="#d62828" stroke-width="2"/>
   <circle cx="100" cy="100" r="5" fill="#d62828" stroke="#111" stroke-width="1.5"/></svg>`;
}
let lastDay=-1;
function tick(){
  const t=jst(), s=t.s+(Date.now()%1000)/1000, m=t.mi+s/60, h=(t.h%12)+m/60;
  const set=(id,deg)=>{const e=document.getElementById(id); if(e) e.setAttribute("transform",`rotate(${deg} 100 100)`)};
  set("hS",s*6); set("hM",m*6); set("hH",h*30);
  if(t.d!==lastDay){lastDay=t.d;renderCal()}
}

/* ===== 詳細ウインドウ ===== */
const dlg=document.getElementById("dlg");
const memoKey=id=>"floor-v3-memo:"+id;
function loadMemo(id){try{return JSON.parse(localStorage.getItem(memoKey(id))||"null")}catch(e){return null}}
function saveMemo(id,text){try{ if(text.trim()) localStorage.setItem(memoKey(id),JSON.stringify({text,at:new Date().toISOString()})); else localStorage.removeItem(memoKey(id)); return true}catch(e){return false}}
function usageBlock(s){
  const u=usageOf(s);
  if(!u) return `<h4>使用量</h4><div class="nomeasure">未計測（自己申告がありません）</div>`;
  const pct=Math.min(100,Math.round(u.context_used/u.context_max*100));
  return `<h4>使用量（自己申告）</h4><div class="usage">
    <span>容量</span><span>${fmtNum(u.context_used)} / ${fmtNum(u.context_max)}（${pct}%）<div class="bar"><i style="width:${pct}%"></i></div></span>
    ${u.output_tokens!=null?`<span>出力トークン</span><span>${fmtNum(u.output_tokens)}</span>`:""}
    ${u.cost_usd!=null?`<span>概算コスト</span><span>$${Number(u.cost_usd).toFixed(2)}</span>`:""}
    <span>測った時刻</span><span>${u.measured?fmtTime(u.measured):"—"}</span></div>
    <div class="nomeasure">自分の状態ファイルに自分で書いた値。コストは公開単価での概算。</div>`;
}
function openDetail(id){
  const p=people().find(x=>x.id===id); if(!p) return;
  const s=p.st, c=colOf(id), memo=loadMemo(id), w=s?waitText(s):"";
  dlg.style.setProperty("--c",c);
  dlg.innerHTML=`<div class="dh"><b>${esc(label(p))} <small style="font-weight:500">${p.title?esc(p.name)+"・":""}${esc(p.role||"")}</small></b><button class="x" id="dx" aria-label="閉じる">✕</button></div>
  <div class="db">
   <dl>
    <dt>状態</dt><dd>${esc(s?STATUS_LABEL[s.status]||s.status:"状態ファイルなし（確認待ち）")}</dd>
    <dt>タスク</dt><dd>${esc(s&&s.task||"—")}</dd>
    <dt>ひとこと</dt><dd>${esc(s&&s.say||"—")}</dd>
    <dt>何待ちか</dt><dd>${w?`<span class="wait">${esc(w)}</span>`:"待ちなし"}</dd>
    <dt>最終更新</dt><dd>${s?fmtTime(s.updated):"—"}${s&&stallLevel(s)?` <span class="badge l${stallLevel(s)}">⚠ ${ageText(ageMs(s))}止まってる</span>`:""}</dd>
   </dl>
   ${usageBlock(s)}
   ${id==="mii"?`<h4>裏方の定期ジョブ（${MII_JOBS.length}件）</h4><ul class="jobs">${MII_JOBS.map(j=>`<li><b>${esc(j[0])}</b>${esc(j[1])}</li>`).join("")}</ul>`:""}
   <h4>書き込み欄</h4>
   <textarea id="memo" placeholder="${esc(label(p))}へのメモ">${esc(memo?memo.text:"")}</textarea>
   <div class="btns">
     <button class="btn" id="msave">保存</button>
     <button class="btn w" id="mcopy">コピー（みーに渡す用）</button>
     <span class="hint" id="mhint">${memo?"保存済み "+fmtTime(memo.at):"この端末のブラウザに保存されます"}</span>
   </div>
  </div>`;
  dlg.showModal();
  dlg.querySelector("#dx").onclick=()=>dlg.close();
  dlg.querySelector("#msave").onclick=()=>{
    const ok=saveMemo(id,dlg.querySelector("#memo").value);
    dlg.querySelector("#mhint").textContent= ok?"保存した ✔（この端末だけ）":"保存できなかった（ブラウザの設定を確認）";
  };
  dlg.querySelector("#mcopy").onclick=async()=>{
    const txt=`【${label(p)}へのメモ】\n${dlg.querySelector("#memo").value}`;
    try{await navigator.clipboard.writeText(txt);dlg.querySelector("#mhint").textContent="コピーした ✔"}
    catch(e){const ta=dlg.querySelector("#memo");ta.select();document.execCommand&&document.execCommand("copy");dlg.querySelector("#mhint").textContent="選択したのでコピーしてな"}
  };
}
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});

/* ===== 操作：ボード・警告・返事＝詳細ウインドウ／デスクを押す＝吹き出し ===== */
function toggleBubble(id){OPEN = OPEN===id?null:id; renderFloor()}
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-detail]"); if(d){openDetail(d.dataset.detail);return}
  const k=e.target.closest("[data-desk]"); if(k){toggleBubble(k.dataset.desk);return}
  if(OPEN&&!e.target.closest(".bubble")){OPEN=null;renderFloor()}
});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[data-desk]")){e.preventDefault();toggleBubble(e.target.dataset.desk)}
  if(e.key==="Escape"&&OPEN){OPEN=null;renderFloor()}
});

/* ===== ライブ読み込み（開いた時＋毎分。サーバー上なら同じ場所、だめならGitHubのmain、全部だめなら埋め込み） ===== */
const RAW="https://raw.githubusercontent.com/gattgati-wq/gacchigachi-floor/main/floor";
async function loadFrom(base){
  const mem=await (await fetch(base+"/members.json",{cache:"no-store"})).json();
  const jf=u=>fetch(u,{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
  const got=await Promise.all(mem.members.map(m=>jf(`${base}/status/${m.id}.json`)));
  const message=await jf(base+"/megaphone/current.json");
  const replies=(await Promise.all(mem.members.map(m=>jf(`${base}/megaphone/replies/${m.id}.json`)))).filter(Boolean);
  return {collected_at:new Date().toISOString(),members:mem,status:got.filter(Boolean),megaphone:{message,replies}};
}
async function tryLive(){
  const bases = location.protocol==="file:" ? [RAW] : ["..",RAW];
  for(const b of bases){
    try{ DATA=await loadFrom(b); source=b===RAW?"ライブ（GitHub main）":"ライブ"; draw(); return; }catch(e){}
  }
  source="埋め込み（古い可能性あり）"; draw();
}
function draw(){
  renderBoard(); renderFloor(); renderAlert(); renderMegaView();
  const c=DATA.collected_at?fmtTime(DATA.collected_at).replace(/（.*）/,""):"—";
  document.getElementById("foot").textContent=`データ：${source}（${c}時点）`;
}
window.renderFloor3=d=>{DATA=d;source="差し替え";draw()};

renderCal(); buildClock(); buildMega(); draw(); tick();
setInterval(tick,100);
setInterval(draw,60000);
tryLive(); setInterval(tryLive,60000);
</script>
