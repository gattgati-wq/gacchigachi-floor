<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ガっチガチ研究所 AI社員フロア</title>
<style>
  :root{
    --wall:#fdf3e7; --wall-line:#f1dfc9; --floor:#f6e2c4; --floor-line:#ecd2ac;
    --ink:#4a3a44; --sub:#8a7783; --card:#fffdfa;
    --c-working:#3fb27f; --c-light:#f0a830; --c-heavy:#e5484d; --c-member:#4a8fe7;
    --c-idle:#9aa7b8; --c-done:#9b6be0; --c-none:#b9b0b6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#2b2230;overflow:hidden;
    font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Rounded Mplus 1c","Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink)}
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;
    background:
      repeating-linear-gradient(90deg,transparent 0 158px,var(--floor-line) 158px 160px),
      linear-gradient(var(--floor),var(--floor));
    border-radius:18px}
  .wall{position:absolute;left:0;top:0;width:1600px;height:250px;
    background:repeating-linear-gradient(90deg,var(--wall) 0 78px,var(--wall-line) 78px 80px);
    border-bottom:10px solid #e6c9a3}
  .abs{position:absolute}
  .title{left:28px;top:20px;background:#ff6f8f;color:#fff;font-weight:800;font-size:30px;
    padding:10px 26px 10px 22px;border-radius:14px;box-shadow:0 4px 0 #d94f71;letter-spacing:.04em}
  .title small{font-size:17px;font-weight:700;opacity:.9;margin-left:10px}
  .collected{left:30px;top:86px;font-size:15px;color:var(--sub)}
  /* 完了ボード */
  .board{left:480px;top:16px;width:420px;height:128px;background:#3c5a4a;border:8px solid #b9895a;border-radius:10px;
    color:#f4fff7;padding:8px 14px;font-size:15px}
  .board h3{margin:0 0 4px;font-size:16px;color:#ffe78a}
  .board ul{margin:0;padding-left:1.1em;line-height:1.45}
  .board .empty{opacity:.7}
  /* 会長室 */
  .chair-room{left:1130px;top:0;width:440px;height:262px;background:#efe2f3;border:8px solid #c9a0d6;border-top:none;
    border-radius:0 0 22px 22px;box-shadow:inset 0 -6px 0 #dcc3e6}
  .chair-room .plate{position:absolute;left:50%;top:22px;transform:translateX(-50%);
    background:linear-gradient(#ffe79a,#e8bc45);color:#5a3d06;font-weight:800;font-size:22px;
    padding:6px 22px;border-radius:8px;box-shadow:0 3px 0 #b88a1c;white-space:nowrap}
  .chair-room .plate small{display:block;font-size:12px;font-weight:700;text-align:center;opacity:.8}
  .chair-room .door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:130px;height:150px;
    background:linear-gradient(#a8724a,#8a5a37);border-radius:12px 12px 0 0;border:5px solid #6d4426;border-bottom:none}
  .chair-room .door::after{content:"";position:absolute;right:16px;top:74px;width:14px;height:14px;border-radius:50%;background:#ffd76a}
  .chair-room .win{position:absolute;top:96px;width:70px;height:58px;background:#cfe9ff;border:5px solid #fff;border-radius:8px}
  .chair-room .redtag{position:absolute;left:50%;top:-14px;transform:translateX(-50%) rotate(-4deg);
    background:var(--c-heavy);color:#fff;font-weight:800;font-size:15px;padding:5px 12px;border-radius:8px;white-space:nowrap;
    box-shadow:0 3px 0 #a92a2e;display:none}
  .chair-room .door .redtag{top:30px}
  /* 休憩スペース */
  .lounge{left:24px;top:600px;width:680px;height:284px;background:#e9f4ec;border:6px dashed #b7d8c1;border-radius:24px}
  .lounge .lbl,.queue-lbl{position:absolute;left:16px;top:8px;font-weight:800;color:#5f8f6e;font-size:17px}
  .queue-lbl{color:#b07a12}
  .rug{left:730px;top:580px;width:380px;height:130px;background:#fff1cf;border:4px dashed #f0c96a;border-radius:20px}
  .rug.heavy{left:1150px;top:268px;width:420px;height:100px;background:#ffe3e1;border-color:#f19a9c}
  .rug.heavy .queue-lbl{color:#c03b3f}
  /* 机 */
  .desk{z-index:4}
  /* 人 */
  .person{z-index:2;width:120px;height:170px}
  .person.front{z-index:6}
  .person svg{width:120px;height:170px;display:block;overflow:visible}
  .person.stale svg,.person.none svg{filter:grayscale(1) opacity(.65)}
  .person.bob svg{animation:bob 3.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .zzz{position:absolute;right:-6px;top:-4px;font-weight:800;color:#8c9bb0;font-size:22px;z-index:9}
  /* 名札 */
  .tag{z-index:8;transform:translateX(-50%);text-align:center;white-space:nowrap}
  .tag .nm{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 14px;font-weight:800;font-size:17px}
  .tag .nm small{font-size:12px;color:var(--sub);margin-left:6px}
  .tag .st{display:block;margin:4px auto 0;width:max-content;color:#fff;font-weight:800;font-size:14px;padding:2px 12px;border-radius:999px}
  .tag .age{display:block;font-size:12px;color:#7b6a74;margin-top:2px}
  /* 吹き出し */
  .bubble{z-index:10;transform:translate(-50%,-100%);max-width:210px;width:max-content;background:var(--card);border:3px solid var(--ink);
    border-radius:16px;padding:7px 12px 6px;font-size:16px;line-height:1.35;box-shadow:0 3px 0 rgba(74,58,68,.25)}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%) rotate(45deg);
    width:16px;height:16px;background:var(--card);border-right:3px solid var(--ink);border-bottom:3px solid var(--ink)}
  .bubble .tm{display:block;font-size:12px;color:var(--sub);margin-top:2px}
  .bubble.stale{opacity:.75;border-style:dashed}
  /* 縦向きスマホ */
  #rotate{display:none;position:fixed;inset:0;z-index:99;background:#2b2230;color:#fff;
    align-items:center;justify-content:center;flex-direction:column;text-align:center;font-weight:800;font-size:22px;gap:14px}
  #rotate .ico{font-size:64px;animation:rot 1.8s ease-in-out infinite}
  @keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (max-width:900px){ #rotate{display:flex} }
</style>
</head>

    stage.appendChild(lounge);
    stage.appendChild(el("rug",730,580,'<div class="queue-lbl">社長代理の許可待ち</div>'));

    // 席の割り当て
    var seatOf = {}, extra = 0;
    mem.forEach(function(m){
      var s = SEATS[m.seat];
      if(!s){ s = EXTRA_SEATS[extra++ % EXTRA_SEATS.length]; }
      seatOf[m.id] = s;
    });

    // 机
    var looks = {}, pool = 0;
    mem.forEach(function(m){ looks[m.id] = LOOKS[m.id] || LOOK_POOL[pool++ % LOOK_POOL.length]; });
    mem.forEach(function(m){
      var s = seatOf[m.id];
      stage.appendChild(el("desk", s.x, s.y, deskSVG(s.kind, looks[m.id].acc)));
    });

    // 完了ボード
    var doneList = [];
    var lc=0, qL=0, qH=0, heavyCount=0;

    mem.forEach(function(m){
      var st = byId[m.id];
      var code = st && STATE[st.status] ? st.status : "none";
      var t = st ? parseTime(st.updated) : null;
      var stale = !st || t==null || (nowT - t) > STALE_HOURS*3600000;
      if(code==="done" && st.task) doneList.push(m.name+"："+st.task);

      // 位置
      var seat = seatOf[m.id], cx, top, tagY, front=false;
      var isBoss = seat.kind==="boss";
      var w = isBoss ? 260 : 220;
      if(!isBoss && code==="idle" && !stale){ var p=LOUNGE[lc++ % LOUNGE.length]; cx=p.x+60; top=p.y; tagY=top+176; front=true; }
      else if(!isBoss && code==="wait_light"){ var p2=Q_LIGHT[qL++ % Q_LIGHT.length]; cx=p2.x+60; top=p2.y; tagY=top+176; front=true; }
      else if(!isBoss && code==="wait_heavy"){ var p3=Q_HEAVY[qH++ % Q_HEAVY.length]; cx=p3.x+60; top=p3.y; tagY=top+176; front=true; heavyCount++; }
      else { cx = seat.x + w/2; top = seat.y - 118; tagY = seat.y + 74; }
      if(code==="wait_heavy" && isBoss) heavyCount++;

      // 人
      var pclass = "person" + (front?" front":"") + (stale?" stale":(code==="working"?" bob":"")) + (code==="none"?" none":"");
      var person = el(pclass, cx-60, top, girl(looks[m.id], stale));
      if(stale) person.insertAdjacentHTML("beforeend",'<div class="zzz">Zzz</div>');
      stage.appendChild(person);

      // 吹き出し（本人の言葉＋時刻だけ）
      if(st && st.say){
        var b = el("bubble"+(stale?" stale":""), cx, top-6,
          esc(String(st.say).slice(0,30)) + '<span class="tm">'+(t!=null?esc(fmtTime(t,nowT)):"時刻なし")+'</span>');
        stage.appendChild(b);
      }

      // 名札
      var label = STATE[code].label;
      if(code==="wait_member") label = (nameOf[st.waiting_for] || st.waiting_for || "誰か") + " 待ち";
      var tagHtml = '<span class="nm">'+esc(m.name)+'<small>'+esc(m.role||"")+'</small></span>'
        + '<span class="st" style="background:'+STATE[code].color+'">'+esc(label)+(st && st.task ? "｜"+esc(st.task) : "")+'</span>'
        + (stale && t!=null ? '<span class="age">'+esc(ageText(nowT-t))+'</span>' : "");
      stage.appendChild(el("tag", cx, tagY, tagHtml));
    });

    var heavyTag = document.getElementById("heavyTag");
    if(heavyCount>0){ heavyTag.textContent = "許可待ち "+heavyCount+"件"; heavyTag.style.display="block"; }

    stage.appendChild(el("board",480,16,'<h3>✅ 完了ボード</h3>' + (doneList.length
      ? '<ul>'+doneList.slice(0,4).map(function(s){return "<li>"+esc(s)+"</li>";}).join("")+'</ul>'
      : '<div class="empty">まだ完了はなし</div>')));
  }

  function fit(){
    var s = Math.min(window.innerWidth/W, window.innerHeight/H);
    var st = document.getElementById("stage");
    st.style.transform = "scale("+s+")";
    st.style.left = ((window.innerWidth - W*s)/2)+"px";
    st.style.top  = ((window.innerHeight - H*s)/2)+"px";
  }

  function load(){
    var data = window.FLOOR_DATA;
    if(!data){
      try{ data = JSON.parse(document.getElementById("floor-data").textContent); }
      catch(e){ data = { members:{members:[]}, status:[] }; }
    }
    render(data);
  }

  window.renderFloor = function(data){ window.FLOOR_DATA = data; render(data); };
  window.addEventListener("resize", fit);
  load(); fit();
})();
</script>
</body>
</html>
